name: CI

# Lint (Black) and test (pytest) on every PR and on pushes to main.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Black is a dev/CI tool, not an app runtime dependency, so it is not in
      # requirements.txt. Pinned to keep formatting checks reproducible.
      - name: Install Black
        run: pip install black==26.5.1

      - name: Check formatting (Black, default settings)
        run: black --check --diff .

      - name: Run tests
        run: pytest -q
